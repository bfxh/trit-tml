name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # 三进制内核：格式、静态检查、测试、产出原生库
  rust:
    name: rust (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 工具链
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        # 带 gpu feature 一起查：否则 gpu 分支的代码在 CI 里根本编译不到，
        # 改坏了也发现不了（这个分支确实坏过一次）。
        run: cargo clippy -p trit-rt --all-targets --features gpu -- -D warnings

      - name: test
        run: |
          cargo test -p trit-rt --release
          cargo test -p trit-rt --release --features gpu

      - name: build cdylib
        # 发布用的 DLL **不带** gpu feature：运行时对 n=1 的窗口扫描一律走 CPU
        # （实测 GPU 慢 58 倍且会 panic，见 crates/trit-rt/src/gpu.rs），
        # 带 wgpu 只是白涨体积；需要排查 GPU 时用 --features gpu 单独出包。
        run: cargo build --release -p trit-rt

      - uses: actions/upload-artifact@v4
        with:
          name: trit-rt-windows
          path: target/release/trit_rt.dll
          if-no-files-found: error

  # C# 兼容壳：含原生 vs 托管逐字节对拍，所以必须在能编译出原生库的机器上跑。
  # 注意：这三步（rust / dotnet / 对拍）是本仓库的核心门禁，必须全绿。
  dotnet:
    name: dotnet (windows)
    runs-on: windows-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 工具链 + 原生库
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo build --release -p trit-rt

      - name: 构建兼容壳
        run: dotnet build dotnet/TritRuntime.Shim/TritRuntime.Shim.csproj -c Release --nologo

      - name: 测试（含原生 vs 托管对拍）
        run: dotnet test dotnet/TritRuntime.Shim.Tests/TritRuntime.Shim.Tests.csproj -c Release --nologo

      # tML 在**游戏内**编译模组源码时不读 csproj 的 <Nullable>（实测：70 条 CS8632 警告，
      # 等于所有 `?` 注解在游戏内构建里被静默忽略）。只有文件内的 `#nullable enable` 有效，
      # 所以这里逐文件检查，防止有人新加文件时漏掉——漏了本地编译仍然是 0 警告，看不出来。
      - name: 模组源码可空上下文
        shell: bash
        run: |
          missing=0
          for f in mod/TritRuntimeMod/src/*.cs; do
            head -3 "$f" | grep -q '#nullable enable' || { echo "缺少 #nullable enable：$f"; missing=1; }
          done
          exit $missing

# 模组工程（mod/TritRuntimeMod）的编译与 .tmod 打包刻意不进 CI：
# 它依赖本机安装的 tModLoader（tMLMod.targets、tModLoader.dll、Libraries/**），
# 而 tML 走 Steam 分发，在 CI 上拉一份完整安装既不稳定也不符合许可。
# 模组的验证方式：本地 `dotnet build mod/TritRuntimeMod/TritRuntimeMod.csproj`，
# 打包 `-p:BuildMod=true`，详见 mod/TritRuntimeMod/README.md 与根 README 的「验证状态」。
