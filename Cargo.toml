[workspace]
resolver = "3"
members = ["crates/trit-rt", "crates/trit-engine"]
# third_party/trit 是独立仓库的子模块：必须排除，否则它的 crate 会被当成
# 本工作区的隐式成员，`version.workspace = true` 会错误地继承本区的版本号。
exclude = ["third_party"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/bfxh/trit-tml"
readme = "README.md"

# 三进制内核只「调用」本地库 third_party/trit（bfxh/trit 的子模块，钉在公开提交上），
# 不复制、不修改、不重新实现其任何算法。
[workspace.dependencies]
trit-engine = { path = "crates/trit-engine", version = "0.1.0" }
trit-core = { path = "third_party/trit/crates/trit-core", version = "0.12.0" }
trit-codec = { path = "third_party/trit/crates/trit-codec", version = "0.12.0" }
trit-schedule = { path = "third_party/trit/crates/trit-schedule", version = "0.12.0" }
trit-net = { path = "third_party/trit/crates/trit-net", version = "0.12.0" }
# 双导轨打包 / 位并行点积 / 矩阵乘的 CPU 镜像恒可用；GPU 内核在 `gpu` feature 后。
trit-gpu = { path = "third_party/trit/crates/trit-gpu", version = "0.12.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

# 发布 profile：随 .tmod 分发的 trit_rt.dll 只保留机器码。
# - strip：去掉符号表，减小 .tmod 体积与加载时的映射开销。
# - lto/codegen-units：跨 crate 内联，兼顾体积与热路径性能。
# 注意：这里不能开 panic = "abort" —— ffi.rs 依赖 catch_unwind 兜住跨 FFI 的 panic，
# abort 会让一次内核 panic 直接带走整个游戏进程。
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

